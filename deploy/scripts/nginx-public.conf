# BeefTV 公网形态的独立 nginx 配置（本机版）。
#
# 为什么不直接用仓库根目录的 nginx.conf：那份是给容器用的 server 片段，
# 依赖镜像提供的 main 上下文和 /usr/share/nginx/html 根目录。本机形态要让
# launchd 在没有 TCC 授权的环境里独立拉起 Web 层，所以这里是一份完整的
# 独立配置：静态资源来自 ~/.local/share/beeftv/web，/api 反代到本机后端。
#
# 占位符由 deploy/scripts/beeftv-public-watchdog.sh 渲染：
#   __LISTEN_PORT__ __WEB_ROOT__ __BACKEND_HOST__ __BACKEND_PORT__
#   __LOG_DIR__ __RUN_DIR__ __MIME_TYPES__

worker_processes 1;
error_log __LOG_DIR__/error.log warn;
pid __RUN_DIR__/nginx.pid;
daemon on;

events {
    worker_connections 1024;
}

http {
    include __MIME_TYPES__;
    default_type application/octet-stream;

    access_log __LOG_DIR__/access.log;
    client_body_temp_path __RUN_DIR__/client_body;
    proxy_temp_path __RUN_DIR__/proxy;
    fastcgi_temp_path __RUN_DIR__/fastcgi;
    uwsgi_temp_path __RUN_DIR__/uwsgi;
    scgi_temp_path __RUN_DIR__/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # 业务配置最高允许 999MB；网关保留少量 multipart 开销。
    client_max_body_size 1024m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    map $http_x_forwarded_proto $canvas_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # 日志不记录查询串，避免把素材签名 URL 写进磁盘。
    log_format canvas_no_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

    upstream beeftv_backend {
        server __BACKEND_HOST__:__BACKEND_PORT__;
        keepalive 16;
    }

    server {
        listen __LISTEN_PORT__;
        server_name _;
        root __WEB_ROOT__;
        index index.html;
        access_log __LOG_DIR__/access.log canvas_no_query;
        add_header Referrer-Policy "no-referrer" always;

        # Vite 产物用内容哈希，可以长期缓存；index.html 不缓存，保证指向当前清单。
        location ^~ /static/ {
            access_log off;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~ ^/api/(tasks/[^/]+/text-events|agent/runs/[^/]+/events)$ {
            proxy_pass http://beeftv_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass_header X-Accel-Buffering;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/api/ai/system/[^/]+/(?:responses|chat/completions|models/[^/]+:streamGenerateContent)$ {
            proxy_pass http://beeftv_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass_header X-Accel-Buffering;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://beeftv_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass_header X-Accel-Buffering;
            proxy_read_timeout 3600s;
        }

        location = /oauth/linuxdo/callback {
            proxy_pass http://beeftv_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 30s;
        }

        location = /assets {
            try_files /index.html =404;
        }

        location = /assets/ {
            try_files /index.html =404;
        }

        location ^~ /share/canvas/ {
            access_log off;
            try_files $uri $uri/ /index.html;
        }

        # /canvas 同时是 React 路由和静态模型资源目录；精确命中路由时必须优先回退到 SPA。
        location = /canvas {
            try_files /index.html =404;
        }

        location = /canvas/ {
            try_files /index.html =404;
        }

        location = /welcome {
            try_files /index.html =404;
        }

        location = /welcome/ {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
